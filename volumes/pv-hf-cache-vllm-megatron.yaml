# pv-hf-cache-vllm-megatron.yaml
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-hf-cache-vllm-megatron
spec:
  capacity:
    storage: 30Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-hostpath
  hostPath:
    path: /var/lib/vllm/hf-cache
    type: DirectoryOrCreate
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - megatron
