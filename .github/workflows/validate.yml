name: Validate reference release
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/check-release.py
      - name: Scan tree and all Git history
        shell: bash
        run: |
          set -euo pipefail
          scanner_version=8.30.1
          scanner_dir=$(mktemp -d)
          cd "$scanner_dir"
          archive="gitleaks_${scanner_version}_linux_x64.tar.gz"
          release_url="https://github.com/gitleaks/gitleaks/releases/download/v${scanner_version}"
          curl --fail --silent --show-error --location "$release_url/$archive" -o "$archive"
          curl --fail --silent --show-error --location "$release_url/gitleaks_${scanner_version}_checksums.txt" -o checksums.txt
          awk -v name="$archive" '$2 == name {print}' checksums.txt > selected-checksum.txt
          test -s selected-checksum.txt
          sha256sum --check selected-checksum.txt
          tar -xzf "$archive" gitleaks
          cd "$GITHUB_WORKSPACE"
          "$scanner_dir/gitleaks" dir . --redact --config .gitleaks.toml
          "$scanner_dir/gitleaks" git . --log-opts=--all --redact --config .gitleaks.toml
