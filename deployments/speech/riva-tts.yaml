# Riva TTS - Soundwave (RTX 4090)
# Text-to-Speech service - shares GPU with ASR via time-slicing
# Port scheme: soundwave 20001-20100
#   - HTTP: 20002
#   - gRPC: 20052
apiVersion: apps/v1
kind: Deployment
metadata:
  name: riva-tts
  namespace: ai
  labels:
    app: riva-tts
    node: soundwave
spec:
  replicas: 1
  selector:
    matchLabels:
      app: riva-tts
  template:
    metadata:
      labels:
        app: riva-tts
    spec:
      nodeSelector:
        kubernetes.io/hostname: soundwave
      imagePullSecrets:
        - name: ngc-secret
      securityContext:
        runAsUser: 0
      containers:
        - name: riva-tts
          image: nvcr.io/nim/nvidia/riva-tts:1.3.0
          imagePullPolicy: IfNotPresent
          env:
            - name: NGC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ngc-api-key
                  key: NGC_API_KEY
            - name: NIM_TAGS_SELECTOR
              value: "name=fastpitch-hifigan-en-us"
            - name: NIM_HTTP_API_PORT
              value: "20002"
            - name: NIM_GRPC_API_PORT
              value: "20052"
          ports:
            - containerPort: 20002
              name: http
            - containerPort: 20052
              name: grpc
          resources:
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: nim-cache
              mountPath: /opt/nim/.cache
            - name: dshm
              mountPath: /dev/shm
          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: 20002
            initialDelaySeconds: 300
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: 20002
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 5
      volumes:
        - name: nim-cache
          hostPath:
            path: /home/operator/.cache/nim-tts
            type: DirectoryOrCreate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: riva-tts
  namespace: ai
spec:
  selector:
    app: riva-tts
  ports:
    - name: grpc
      port: 20052
      targetPort: 20052
    - name: http
      port: 20002
      targetPort: 20002
  type: ClusterIP
