apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    deployment.kubernetes.io/revision: "3"
  name: qwen3-coder-awq
  namespace: ai
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app: qwen3-coder-awq
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: qwen3-coder-awq
    spec:
      containers:
      - args:
        - --host
        - 0.0.0.0
        - --port
        - "8000"
        - --model
        - QuantTrio/Qwen3-Coder-30B-A3B-Instruct-AWQ
        - --served-model-name
        - qwen3-coder-awq
        - --quantization
        - awq_marlin
        - --dtype
        - float16
        - --gpu-memory-utilization
        - "0.90"
        - --max-model-len
        - "32768"
        - --trust-remote-code
        env:
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              key: token
              name: hf-token
        - name: HF_HOME
          value: /root/.cache/huggingface
        - name: TRANSFORMERS_CACHE
          value: /root/.cache/huggingface
        image: vllm/vllm-openai:cu130-nightly-aarch64
        imagePullPolicy: IfNotPresent
        name: vllm
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        resources:
          limits:
            nvidia.com/gpu: "1"
          requests:
            nvidia.com/gpu: "1"
        terminationMessagePath: /dev/termination-log
        terminationMessagePolicy: File
      dnsPolicy: ClusterFirst
      nodeSelector:
        kubernetes.io/hostname: megatron
      restartPolicy: Always
      runtimeClassName: nvidia
      schedulerName: default-scheduler
      terminationGracePeriodSeconds: 30
