# =============================================================================
# Jellyfin — thundercracker (media server)
# Migrated from Podman to K8s
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: ai
  labels:
    app: jellyfin
    node: thundercracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      nodeName: thundercracker
      containers:
      - name: jellyfin
        image: jellyfin/jellyfin:latest
        ports:
        - containerPort: 8096
          name: http
        volumeMounts:
        - name: config
          mountPath: /config
        - name: cache
          mountPath: /cache
        - name: movies
          mountPath: /movies
          readOnly: true
        - name: series
          mountPath: /series
          readOnly: true
        - name: studies
          mountPath: /studies
          readOnly: true
        resources:
          requests:
            memory: "512Mi"
          limits:
            memory: "2Gi"
        readinessProbe:
          httpGet:
            path: /health
            port: 8096
          initialDelaySeconds: 15
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8096
          initialDelaySeconds: 30
          periodSeconds: 30
      volumes:
      - name: config
        hostPath:
          path: /SSD2/streaming/jellyfin/config
          type: Directory
      - name: cache
        hostPath:
          path: /SSD2/streaming/jellyfin/cache
          type: Directory
      - name: movies
        hostPath:
          path: /SSD2/streaming/Movies
          type: Directory
      - name: series
        hostPath:
          path: /SSD2/streaming/Series
          type: Directory
      - name: studies
        hostPath:
          path: /SSD2/streaming/Studies
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: ai
spec:
  selector:
    app: jellyfin
  ports:
  - port: 8096
    targetPort: 8096
    protocol: TCP
    name: http
  type: NodePort
