# =============================================================================
# Google Calendar MCP Server (FIXED)
# Node: thundercracker (x86_64, No GPU)
# Package: @gongrzhe/server-calendar-autoauth-mcp
# Expects credentials in: ~/.calendar-mcp/gcp-oauth.keys.json
# =============================================================================
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: gcal-mcp-config
  namespace: ai
data:
  config.json: |
    {
      "mcpServers": {
        "google-calendar": {
          "command": "npx",
          "args": [
            "-y",
            "@gongrzhe/server-calendar-autoauth-mcp"
          ]
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcal-mcp
  namespace: ai
  labels:
    app: gcal-mcp
    role: mcp-server
    tier: tools
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gcal-mcp
  template:
    metadata:
      labels:
        app: gcal-mcp
        role: mcp-server
    spec:
      nodeSelector:
        kubernetes.io/hostname: thundercracker
      initContainers:
      - name: setup-auth
        image: busybox:1.36
        command:
        - sh
        - -c
        - |
          mkdir -p /calendar-mcp
          cp /secrets/gcp-oauth.keys.json /calendar-mcp/gcp-oauth.keys.json
          if [ -f /secrets/token.json ]; then
            cp /secrets/token.json /calendar-mcp/credentials.json
          fi
          chmod -R 644 /calendar-mcp/*
          ls -la /calendar-mcp/
        volumeMounts:
        - name: oauth-secrets
          mountPath: /secrets
          readOnly: true
        - name: gcal-data
          mountPath: /calendar-mcp
      containers:
      - name: mcpo
        image: ghcr.io/open-webui/mcpo:main
        args:
        - "mcpo"
        - "--port"
        - "8200"
        - "--config"
        - "/config/config.json"
        ports:
        - containerPort: 8200
          name: http
          protocol: TCP
        volumeMounts:
        - name: mcp-config
          mountPath: /config
          readOnly: true
        - name: gcal-data
          mountPath: /root/.calendar-mcp
        readinessProbe:
          httpGet:
            path: /docs
            port: 8200
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /docs
            port: 8200
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 5
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
      volumes:
      - name: mcp-config
        configMap:
          name: gcal-mcp-config
      - name: oauth-secrets
        secret:
          secretName: google-oauth-calendar
      - name: gcal-data
        emptyDir: {}
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: gcal-mcp
  namespace: ai
  labels:
    app: gcal-mcp
spec:
  type: ClusterIP
  selector:
    app: gcal-mcp
  ports:
  - name: http
    port: 8200
    targetPort: 8200
    protocol: TCP
