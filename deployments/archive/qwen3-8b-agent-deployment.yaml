# =============================================================================
# Qwen3-8B — Tool-Calling Agent Brain
# Node: soundwave (x86_64, RTX 4090, Control Plane)
# Purpose: Dedicated lightweight model for agentic tool-calling / MCP routing
# vLLM with --enable-auto-tool-choice for native OpenAI function-calling API
# =============================================================================
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-8b-agent
  namespace: ai
  labels:
    app: qwen3-8b-agent
    role: agent-brain
    tier: inference
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen3-8b-agent
  strategy:
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: qwen3-8b-agent
        role: agent-brain
    spec:
      runtimeClassName: nvidia
      nodeSelector:
        kubernetes.io/hostname: soundwave
      containers:
      - name: vllm
        image: vllm/vllm-openai:latest
        imagePullPolicy: IfNotPresent
        args:
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "8000"
        - "--model"
        - "Qwen/Qwen3-8B"
        - "--served-model-name"
        - "qwen3-8b-agent"
        - "--dtype"
        - "float16"
        - "--gpu-memory-utilization"
        - "0.85"
        - "--max-model-len"
        - "16384"
        - "--trust-remote-code"
        # ---- Tool Calling Configuration ----
        - "--enable-auto-tool-choice"
        - "--tool-call-parser"
        - "hermes"
        # NOTE: To disable thinking mode per-request, pass in the API call:
        #   "chat_template_kwargs": {"enable_thinking": false}
        # This is not a CLI flag in current vLLM versions.
        env:
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
        - name: HF_HOME
          value: /root/.cache/huggingface
        - name: TRANSFORMERS_CACHE
          value: /root/.cache/huggingface
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        resources:
          limits:
            nvidia.com/gpu: "1"
          requests:
            nvidia.com/gpu: "1"
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 15
          timeoutSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 180
          periodSeconds: 30
          timeoutSeconds: 5
        volumeMounts:
        - name: hf-cache
          mountPath: /root/.cache/huggingface
      volumes:
      - name: hf-cache
        persistentVolumeClaim:
          claimName: hf-cache-soundwave
      terminationGracePeriodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-8b-agent
  namespace: ai
  labels:
    app: qwen3-8b-agent
spec:
  type: ClusterIP
  selector:
    app: qwen3-8b-agent
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    protocol: TCP
