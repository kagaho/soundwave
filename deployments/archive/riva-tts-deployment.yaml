apiVersion: apps/v1
kind: Deployment
metadata:
  name: riva-tts
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: riva-tts
  template:
    metadata:
      labels:
        app: riva-tts
    spec:
      nodeSelector:
        kubernetes.io/hostname: soundwave
      imagePullSecrets:
        - name: ngc-secret
      containers:
        - name: riva-tts
          image: nvcr.io/nim/nvidia/riva-tts:1.3.0
          imagePullPolicy: IfNotPresent
          env:
            - name: NGC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: ngc-api-key
                  key: NGC_API_KEY
            - name: NIM_TAGS_SELECTOR
              value: "name=fastpitch-hifigan-en-us"
            - name: NIM_HTTP_API_PORT
              value: "9000"
            - name: NIM_GRPC_API_PORT
              value: "50052"
          ports:
            - containerPort: 9000
              name: http
            - containerPort: 50052
              name: grpc
          resources:
            limits:
              nvidia.com/gpu: "1"
          volumeMounts:
            - name: nim-cache
              mountPath: /opt/nim/.cache
            - name: dshm
              mountPath: /dev/shm
          livenessProbe:
            httpGet:
              path: /v1/health/live
              port: 9000
            initialDelaySeconds: 300
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /v1/health/ready
              port: 9000
            initialDelaySeconds: 120
            periodSeconds: 10
      securityContext:
        runAsUser: 0
      volumes:
        - name: nim-cache
          hostPath:
            path: /home/operator/.cache/nim-tts
            type: DirectoryOrCreate
        - name: dshm
          emptyDir:
            medium: Memory
            sizeLimit: 8Gi
---
apiVersion: v1
kind: Service
metadata:
  name: riva-tts
  namespace: ai
spec:
  selector:
    app: riva-tts
  ports:
    - name: grpc
      port: 50052
      targetPort: 50052
    - name: http
      port: 9000
      targetPort: 9000
  type: ClusterIP
