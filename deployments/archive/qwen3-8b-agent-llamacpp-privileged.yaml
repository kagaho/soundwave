apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-8b-agent
  namespace: ai
  labels:
    app: qwen3-8b-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen3-8b-agent
  template:
    metadata:
      labels:
        app: qwen3-8b-agent
        role: agent-brain
    spec:
      nodeName: shockwave
      containers:
      - name: llama-server
        image: minimax-llama:latest
        imagePullPolicy: Never
        securityContext:
          privileged: true
        ports:
        - containerPort: 8000
          protocol: TCP
        args:
        - --model
        - /models/Qwen3-8B-Q8_0.gguf
        - --alias
        - qwen3-8b-agent
        - --n-gpu-layers
        - "999"
        - --ctx-size
        - "16384"
        - --threads
        - "8"
        - --port
        - "8000"
        - --host
        - 0.0.0.0
        env:
        - name: LD_LIBRARY_PATH
          value: /usr/local/cuda/lib:/usr/lib/nvidia
        - name: NVIDIA_VISIBLE_DEVICES
          value: all
        - name: NVIDIA_DRIVER_CAPABILITIES
          value: compute,utility
        resources:
          limits:
            nvidia.com/gpu: "1"
          requests:
            nvidia.com/gpu: "1"
        volumeMounts:
        - name: model-data
          mountPath: /models
          readOnly: true
        - name: cuda-libs
          mountPath: /usr/local/cuda/lib
          readOnly: true
        - name: nvidia-libs
          mountPath: /usr/lib/nvidia
          readOnly: true
        - name: dev
          mountPath: /dev
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 120
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 3
      volumes:
      - name: model-data
        hostPath:
          path: /home/operator/models/qwen3-8b
          type: Directory
      - name: cuda-libs
        hostPath:
          path: /usr/local/cuda-13.0/targets/sbsa-linux/lib
          type: Directory
      - name: nvidia-libs
        hostPath:
          path: /usr/lib/aarch64-linux-gnu/nvidia
          type: Directory
      - name: dev
        hostPath:
          path: /dev
          type: Directory
