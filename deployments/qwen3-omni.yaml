apiVersion: apps/v1
kind: Deployment
metadata:
  name: qwen3-omni
  namespace: ai
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qwen3-omni
  template:
    metadata:
      labels:
        app: qwen3-omni
    spec:
      nodeSelector:
        kubernetes.io/hostname: shockwave
      containers:
      - name: vllm
        image: vllm/vllm-openai:cu130-nightly-aarch64
        imagePullPolicy: IfNotPresent
        securityContext:
          privileged: true
        args:
        - "--host"
        - "0.0.0.0"
        - "--port"
        - "8000"
        - "--model"
        - "Qwen/Qwen3-Omni-30B-A3B-Instruct"
        - "--served-model-name"
        - "qwen3-omni"
        - "--dtype"
        - "bfloat16"
        - "--max-model-len"
        - "32768"
        - "--trust-remote-code"
        - "--allowed-local-media-path"
        - "/"
        - "--enforce-eager"
        env:
        - name: HUGGING_FACE_HUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: hf-token
              key: token
        - name: HF_HOME
          value: /root/.cache/huggingface
        - name: LD_LIBRARY_PATH
          value: /usr/lib/aarch64-linux-gnu/nvidia:/usr/local/nvidia/lib:/usr/local/nvidia/lib64:/usr/local/cuda/lib64
        - name: TRITON_PTXAS_PATH
          value: /usr/local/cuda/bin/ptxas
        

        volumeMounts:
        - name: dev-nvidia0
          mountPath: /dev/nvidia0
        - name: dev-nvidia1
          mountPath: /dev/nvidia1
        - name: dev-nvidiactl
          mountPath: /dev/nvidiactl
        - name: dev-nvidia-modeset
          mountPath: /dev/nvidia-modeset
        - name: dev-nvidia-uvm
          mountPath: /dev/nvidia-uvm
        - name: dev-nvidia-uvm-tools
          mountPath: /dev/nvidia-uvm-tools
        - name: nvidia-libdir
          mountPath: /usr/lib/aarch64-linux-gnu/nvidia
          readOnly: true
        ports:
        - containerPort: 8000
          name: http
      volumes:
      - name: dev-nvidia0
        hostPath:
          path: /dev/nvidia0
          type: CharDevice
      - name: dev-nvidia1
        hostPath:
          path: /dev/nvidia1
          type: CharDevice
      - name: dev-nvidiactl
        hostPath:
          path: /dev/nvidiactl
          type: CharDevice
      - name: dev-nvidia-modeset
        hostPath:
          path: /dev/nvidia-modeset
          type: CharDevice
      - name: dev-nvidia-uvm
        hostPath:
          path: /dev/nvidia-uvm
          type: CharDevice
      - name: dev-nvidia-uvm-tools
        hostPath:
          path: /dev/nvidia-uvm-tools
          type: CharDevice
      - name: nvidia-libdir
        hostPath:
          path: /usr/lib/aarch64-linux-gnu/nvidia
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: qwen3-omni
  namespace: ai
spec:
  selector:
    app: qwen3-omni
  ports:
  - name: http
    port: 8000
    targetPort: 8000
