---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minimax-m2-5
  namespace: ai
  labels:
    app: minimax-m2-5
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minimax-m2-5
  template:
    metadata:
      labels:
        app: minimax-m2-5
    spec:
      nodeName: shockwave
      containers:
        - name: llama-server
          image: minimax-llama:latest
          imagePullPolicy: Never
          env:
            - name: LD_LIBRARY_PATH
              value: "/usr/local/cuda/lib:/usr/lib/nvidia"
          args:
            - "--model"
            - "/models/UD-Q3_K_XL/MiniMax-M2.5-UD-Q3_K_XL-00001-of-00004.gguf"
            - "--alias"
            - "minimax-m2.5"
            - "--n-gpu-layers"
            - "999"
            - "--ctx-size"
            - "4096"
            - "--threads"
            - "8"
            - "--port"
            - "8001"
            - "--host"
            - "0.0.0.0"
          ports:
            - containerPort: 8001
              protocol: TCP
          volumeMounts:
            - name: model-data
              mountPath: /models
              readOnly: true
            - name: cuda-libs
              mountPath: /usr/local/cuda/lib
              readOnly: true
            - name: nvidia-libs
              mountPath: /usr/lib/nvidia
              readOnly: true
          resources:
            limits:
              nvidia.com/gpu: "1"
            requests:
              nvidia.com/gpu: "1"
      volumes:
        - name: model-data
          hostPath:
            path: /home/operator/Documents/minimax-container/MiniMax-M2.5-GGUF
            type: Directory
        - name: cuda-libs
          hostPath:
            path: /usr/local/cuda-13.0/targets/sbsa-linux/lib
            type: Directory
        - name: nvidia-libs
          hostPath:
            path: /usr/lib/aarch64-linux-gnu/nvidia
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: minimax-m2-5
  namespace: ai
  labels:
    app: minimax-m2-5
spec:
  type: ClusterIP
  selector:
    app: minimax-m2-5
  ports:
    - port: 8001
      targetPort: 8001
      protocol: TCP
