<!--?xml version="1.0" encoding="UTF-8"?-->
<svg width="1200" height="140" viewBox="0 0 1200 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Till All Are One">
  <defs>
    <!-- Subtle neon glow -->
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="2.8" result="blur1"></feGaussianBlur>
      <feGaussianBlur stdDeviation="6.5" result="blur2"></feGaussianBlur>
      <feMerge>
        <feMergeNode in="blur2"></feMergeNode>
        <feMergeNode in="blur1"></feMergeNode>
        <feMergeNode in="SourceGraphic"></feMergeNode>
      </feMerge>
    </filter>

    <!-- Background faint grid -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" opacity="0.18" stroke="#7ffcff" stroke-width="1"></path>
    </pattern>

    <!-- Text gradient -->
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#b7fff5"></stop>
      <stop offset="45%" stop-color="#7ffcff"></stop>
      <stop offset="100%" stop-color="#9a7bff"></stop>
    </linearGradient>

    <!-- Small highlight gradient -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"></stop>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.05"></stop>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"></stop>
    </linearGradient>
  </defs>

  <!-- Transparent background; the grid is very faint -->
  <rect x="0" y="0" width="1200" height="140" fill="url(#grid)" opacity="0.25"></rect>

  <!-- Decorative lines -->
  <g opacity="0.75">
    <path d="M80 38 H1120" stroke="#7ffcff" stroke-width="2" opacity="0.22"></path>
    <path d="M140 112 H1060" stroke="#9a7bff" stroke-width="2" opacity="0.18"></path>
    <circle cx="110" cy="38" r="4" fill="#7ffcff" opacity="0.5"></circle>
    <circle cx="1090" cy="112" r="4" fill="#9a7bff" opacity="0.45"></circle>
  </g>

  <!-- Title -->
  <g filter="url(#glow)">
    <!-- Outline for extra “tech” crispness -->
    <text x="600" y="88" text-anchor="middle" font-size="40" font-weight="700" letter-spacing="6" font-family="Orbitron, Rajdhani, Oxanium, 'Segoe UI', Arial, sans-serif" fill="none" stroke="#0b0f14" stroke-width="6" opacity="0.55">TILL ALL ARE ONE</text>

    <!-- Main text -->
    <text x="600" y="88" text-anchor="middle" font-size="40" font-weight="700" letter-spacing="6" font-family="Orbitron, Rajdhani, Oxanium, 'Segoe UI', Arial, sans-serif" fill="url(#txt)">TILL ALL ARE ONE</text>

    <!-- Soft sheen overlay -->
    <text x="600" y="88" text-anchor="middle" font-size="40" font-weight="700" letter-spacing="6" font-family="Orbitron, Rajdhani, Oxanium, 'Segoe UI', Arial, sans-serif" fill="url(#sheen)" opacity="0.55">TILL ALL ARE ONE</text>
  </g>
</svg>