---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-nanobot-thundercracker
  labels:
    app: soundwave-nanobot
    node: thundercracker
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: local-hostpath
  local:
    path: /srv/nanobot/workspace
  nodeAffinity:
    required:
      nodeSelectorTerms:
        - matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - thundercracker
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nanobot-workspace
  namespace: ai
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: local-hostpath
  selector:
    matchLabels:
      app: soundwave-nanobot
